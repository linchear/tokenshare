name: release
# Push a tag like v0.1.0 to build the packages and publish a GitHub release.
# Run it by hand ("Run workflow") to build the packages without publishing.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

jobs:
  macos:
    runs-on: macos-latest # Apple Silicon
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      # Installed apps compare their own version with the release's, so the
      # tag must match the version the app is built with.
      - name: Check the tag matches the version
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          version=$(cargo metadata --no-deps --format-version 1 |
            python3 -c 'import sys,json; print(next(p["version"] for p in json.load(sys.stdin)["packages"] if p["name"]=="tokenshare-tray"))')
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match the app version $version (Cargo.toml)"
            exit 1
          fi
      - run: packaging/macos/build-app.sh
      # Ad-hoc signature only (no Apple developer account): Gatekeeper still
      # asks for a right-click > Open the first time.
      - run: codesign --force --deep --sign - "target/release/bundle/Token Share.app"
      - run: ditto -c -k --keepParent "Token Share.app" "$GITHUB_WORKSPACE/tokenshare-macos-arm64.zip"
        working-directory: target/release/bundle
      # The update installed apps download. No extended attributes: they would
      # turn into stray ._ files inside the bundle and break its signature.
      - run: COPYFILE_DISABLE=1 tar --no-mac-metadata -czf "$GITHUB_WORKSPACE/tokenshare-macos-arm64.app.tar.gz" "Token Share.app"
        working-directory: target/release/bundle
      # Sign it with the project's update key and describe it in latest.json,
      # which installed apps read from the newest release. Without the
      # TOKENSHARE_UPDATE_KEY secret the release is published as before, but
      # installed apps do not see it. See docs/packaging.md#updates.
      - name: Sign the update
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          UPDATE_KEY: ${{ secrets.TOKENSHARE_UPDATE_KEY }}
        run: |
          if [ -z "$UPDATE_KEY" ]; then
            echo "::warning::No TOKENSHARE_UPDATE_KEY secret: installed apps will not be offered this release"
            exit 0
          fi
          brew install minisign
          umask 077
          printf '%s\n' "$UPDATE_KEY" > "$RUNNER_TEMP/update.key"
          archive=tokenshare-macos-arm64.app.tar.gz
          minisign -S -s "$RUNNER_TEMP/update.key" -m "$archive" -x "$RUNNER_TEMP/update.minisig" \
            -t "Token Share $GITHUB_REF_NAME" < /dev/null
          rm -f "$RUNNER_TEMP/update.key"
          base64 < "$RUNNER_TEMP/update.minisig" | tr -d '\n' > "$archive.sig"
          packaging/update-manifest.py "$GITHUB_REF_NAME" \
            "https://github.com/$GITHUB_REPOSITORY/releases/download/$GITHUB_REF_NAME/$archive" \
            "$(cat "$archive.sig")" > latest.json
      - uses: actions/upload-artifact@v4
        with:
          name: macos
          path: |
            tokenshare-macos-arm64.zip
            tokenshare-macos-arm64.app.tar.gz
            tokenshare-macos-arm64.app.tar.gz.sig
            latest.json

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --release -p tokenshare-tray -p tokenshare
      - name: Zip
        shell: pwsh
        run: |
          New-Item -ItemType Directory dist | Out-Null
          Copy-Item target/release/tokenshare-tray.exe, target/release/tokenshare.exe dist/
          # The MSVC build links the WebView2 loader statically; ship the DLL
          # only if the build produced one.
          Get-ChildItem target/release/build -Recurse -Filter WebView2Loader.dll |
            Select-Object -First 1 | ForEach-Object { Copy-Item $_.FullName dist/ }
          Compress-Archive -Path dist/* -DestinationPath tokenshare-windows-x64.zip
      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: tokenshare-windows-x64.zip

  linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      # build-deb.sh cross-compiles against glibc 2.17 with zig so the .deb
      # runs on older distributions than this runner.
      - run: |
          git config user.name "Lin Chear"
          git config user.email "lin@chear.ca"
      - run: pip install ziglang
      - run: cargo install cargo-zigbuild --locked
      - run: packaging/linux/build-deb.sh
      - uses: actions/upload-artifact@v4
        with:
          name: linux
          path: target/deb/*.deb

  publish:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [macos, windows, linux]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Checksums
        run: cd dist && sha256sum * > SHA256SUMS
      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" dist/* \
            --repo "$GITHUB_REPOSITORY" \
            --title "Token Share ${GITHUB_REF_NAME#v}" \
            --generate-notes
