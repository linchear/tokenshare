[package]
name = "tokenshare-core"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
anyhow = "1.0.104"
axum = "0.8.9"
bytes = "1.12.1"
directories = "6.0.0"
futures-util = "0.3.34"
rand = "0.10.3"
reqwest = { version = "0.13.5", default-features = false, features = ["stream", "json", "rustls"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sha2 = "0.11.1"
tokio = { version = "1.53.3", features = ["rt-multi-thread", "macros", "net", "time", "signal", "sync"] }
toml = "1.1.8"
tracing = "0.1.44"
uuid = { version = "1.28.0", features = ["v4"] }

[dev-dependencies]
axum = "0.8.9"
reqwest = { version = "0.13.5", default-features = false, features = ["stream", "json", "rustls"] }
tokio = { version = "1.53.3", features = ["test-util"] }
tracing = "0.1.44"
tracing-subscriber = "0.3.23"
